name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Type checks and the price table audit are platform independent, so
      # they run once instead of in every matrix cell.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p scripts/tsconfig.json
          npx tsc --noEmit -p test/tsconfig.json
      # Structural check on the price table (lapsed or overlapping rate
      # windows). Offline and clock-independent - only fires on a real gap.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run pricing:audit
      - run: npm test

  # Installs the packed tarball into an empty project and renders a card from
  # it, so a file missing from package.json "files" (fonts, licenses) or a
  # missing resvg binary fails here instead of on a user's machine.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: Pack and install into an empty project
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/tokenbill-*.tgz
      - name: Render a card from the installed package
        shell: bash
        working-directory: ${{ runner.temp }}/clean
        run: |
          for f in SpaceGrotesk-Medium.ttf SpaceGrotesk-Bold.ttf JetBrainsMono-Regular.ttf \
                   JetBrainsMono-Bold.ttf OFL-SpaceGrotesk.txt OFL-JetBrainsMono.txt; do
            test -f "node_modules/tokenbill/fonts/$f" || { echo "missing fonts/$f"; exit 1; }
          done
          npx tokenbill card "$GITHUB_WORKSPACE/fixtures" --since 2000-01-01 --redact --out card.png
          # Without a resvg binary the CLI writes card.svg instead; require a real PNG.
          test -f card.png || { echo "no card.png, PNG renderer unavailable"; exit 1; }
          node -e 'const b=require("fs").readFileSync("card.png"); if (b.readUInt32BE(0) !== 0x89504e47) { console.error("card.png is not a PNG"); process.exit(1) }'
      - uses: actions/upload-artifact@v4
        with:
          name: card-${{ matrix.os }}
          path: ${{ runner.temp }}/clean/card.png

  # Runs the repo's own action.yml against the committed fixtures with the
  # code from this checkout, so a broken action surfaces before users hit it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: ./
        with:
          path: fixtures
          version: local
          budget: "1000"
